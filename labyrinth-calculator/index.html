<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moog Labyrinth — Polyrhythm Explorer</title>
<style>
:root {
    --bg: #08080f;
    --bg-panel: #0e0e1a;
    --bg-raised: #161628;
    --bg-hover: #1c1c35;
    --border: #252545;
    --border-light: #35355a;
    --text: #c0c0d8;
    --text-dim: #5a5a80;
    --text-bright: #eeeeff;
    --seq-a: #00d4ff;
    --seq-a-dim: rgba(0,212,255,0.15);
    --seq-a-glow: rgba(0,212,255,0.5);
    --seq-b: #ff3d7f;
    --seq-b-dim: rgba(255,61,127,0.15);
    --seq-b-glow: rgba(255,61,127,0.5);
    --hit: #ffcc00;
    --hit-dim: rgba(255,204,0,0.15);
    --hit-glow: rgba(255,204,0,0.5);
    --rest: #111122;
    --accent: #7b5cff;
    --accent-dim: rgba(123,92,255,0.2);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'SF Mono','Fira Code','Cascadia Code','JetBrains Mono','Consolas',monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

.header {
    text-align: center;
    padding: 1.8rem 1rem 1.2rem;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #0c0c18 0%, var(--bg) 100%);
}
.header h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--text-bright);
    margin-bottom: .25rem;
}
.header h1 .ca { color: var(--seq-a); }
.header h1 .cb { color: var(--seq-b); }
.header .sub {
    font-size: .68rem;
    color: var(--text-dim);
    letter-spacing: .08em;
}

.container { max-width: 1260px; margin: 0 auto; padding: 1.4rem; }

/* ── Sequencer Panels ── */
.sequencers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.2rem;
    margin-bottom: 1.2rem;
}
.seq-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.2rem;
}
.seq-panel.spa { border-color: rgba(0,212,255,.25); }
.seq-panel.spb { border-color: rgba(255,61,127,.25); }

.seq-title {
    font-size: .65rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    margin-bottom: .85rem;
    display: flex;
    align-items: center;
    gap: .45rem;
}
.spa .seq-title { color: var(--seq-a); }
.spb .seq-title { color: var(--seq-b); }

.seq-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    display: inline-block;
}
.spa .seq-dot { background: var(--seq-a); box-shadow: 0 0 6px var(--seq-a-glow); }
.spb .seq-dot { background: var(--seq-b); box-shadow: 0 0 6px var(--seq-b-glow); }

.len-row {
    display: flex;
    align-items: center;
    gap: .7rem;
    margin-bottom: .9rem;
}
.len-row label {
    font-size: .6rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .1em;
    min-width: 44px;
}
.len-btns { display: flex; gap: 3px; }
.len-btn {
    width: 30px; height: 26px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-dim);
    font-family: inherit;
    font-size: .72rem;
    cursor: pointer;
    border-radius: 4px;
    transition: all .12s;
}
.len-btn:hover { background: var(--bg-hover); color: var(--text); }
.spa .len-btn.active { background: var(--seq-a-dim); border-color: var(--seq-a); color: var(--seq-a); }
.spb .len-btn.active { background: var(--seq-b-dim); border-color: var(--seq-b); color: var(--seq-b); }

.steps-row { display: flex; gap: 5px; flex-wrap: wrap; }
.step-btn {
    width: 38px; height: 38px;
    border-radius: 7px;
    border: 2px solid var(--border);
    background: var(--rest);
    cursor: pointer;
    transition: all .12s;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}
.step-btn .led {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--border);
    transition: all .12s;
}
.step-btn:hover { border-color: var(--text-dim); }
.step-btn .snum {
    position: absolute;
    top: -13px;
    font-size: .5rem;
    color: var(--text-dim);
}

.spa .step-btn.on { border-color: var(--seq-a); background: var(--seq-a-dim); }
.spa .step-btn.on .led { background: var(--seq-a); box-shadow: 0 0 8px var(--seq-a-glow); }
.spb .step-btn.on { border-color: var(--seq-b); background: var(--seq-b-dim); }
.spb .step-btn.on .led { background: var(--seq-b); box-shadow: 0 0 8px var(--seq-b-glow); }

.quick-row { display: flex; gap: 5px; margin-top: .7rem; }
.qbtn {
    font-family: inherit;
    font-size: .55rem;
    padding: 3px 7px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-dim);
    border-radius: 4px;
    cursor: pointer;
    transition: all .12s;
    letter-spacing: .04em;
    text-transform: uppercase;
}
.qbtn:hover { background: var(--bg-hover); color: var(--text); }

/* ── Visualization ── */
.viz {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.2rem;
    margin-bottom: 1.2rem;
}
.viz-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: .9rem;
    flex-wrap: wrap;
    gap: .6rem;
}
.viz-title {
    font-size: .68rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--text-dim);
}
.viz-stats { display: flex; gap: 1.4rem; }
.stat-label {
    font-size: .5rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .1em;
}
.stat-val {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-bright);
}
.stat-val.gold { color: var(--hit); }

.legend {
    display: flex;
    gap: 1rem;
    margin-bottom: .8rem;
    font-size: .58rem;
    color: var(--text-dim);
    flex-wrap: wrap;
}
.legend span {
    display: flex;
    align-items: center;
    gap: 4px;
}
.legend .ld {
    width: 10px; height: 10px;
    border-radius: 2px;
    display: inline-block;
}
.ld.la { background: var(--seq-a); }
.ld.lb { background: var(--seq-b); }
.ld.lboth { background: var(--hit); }
.ld.lrest { background: var(--rest); border: 1px solid var(--border); }

.timeline { overflow-x: auto; padding-bottom: 6px; }
.tl-row {
    display: flex;
    align-items: center;
    margin-bottom: 2px;
}
.tl-label {
    width: 74px;
    min-width: 74px;
    font-size: .58rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding-right: 8px;
    text-align: right;
    flex-shrink: 0;
}
.tl-label.la { color: var(--seq-a); }
.tl-label.lb { color: var(--seq-b); }
.tl-label.lc { color: var(--hit); }
.tl-label.ln { color: var(--text-dim); }

.tl-cells { display: flex; gap: 0; }
.tl-cell {
    width: 18px; height: 18px;
    min-width: 18px;
    border-radius: 3px;
    background: var(--rest);
    transition: all .08s;
    margin-right: 2px;
}
.tl-cell.bnd { margin-left: 4px; }
.tl-cell.on-a { background: var(--seq-a); box-shadow: 0 0 3px var(--seq-a-dim); }
.tl-cell.on-b { background: var(--seq-b); box-shadow: 0 0 3px var(--seq-b-dim); }
.tl-cell.on-ab { background: var(--hit); box-shadow: 0 0 3px var(--hit-dim); }
.tl-cell.playhead { outline: 2px solid #fff; outline-offset: 1px; z-index: 2; position: relative; }

.tl-num {
    width: 18px; min-width: 18px;
    text-align: center;
    font-size: .48rem;
    color: var(--text-dim);
    margin-right: 2px;
}
.tl-num.bnd { margin-left: 4px; }

/* ── Min Pattern ── */
.minpat {
    margin-top: 1.1rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--border);
}
.minpat-title {
    font-size: .65rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--hit);
    margin-bottom: .65rem;
}
.minpat-cells {
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
    align-items: center;
}
.mc {
    width: 26px; height: 26px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .65rem;
    font-weight: 700;
}
.mc.mhit { background: var(--hit); color: var(--bg); box-shadow: 0 0 8px var(--hit-glow); }
.mc.mrest { background: var(--rest); border: 1px solid var(--border); color: var(--text-dim); }

.pat-text {
    font-size: .72rem;
    color: var(--text-dim);
    margin-top: .45rem;
    letter-spacing: .18em;
}
.pat-detail-text {
    font-size: .6rem;
    color: var(--text-dim);
    margin-top: .25rem;
    letter-spacing: .06em;
}

/* ── Playback ── */
.playback {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
}
.play-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: .95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .12s;
    flex-shrink: 0;
}
.play-btn:hover, .play-btn.on { background: var(--accent); color: var(--bg); }
.bpm-ctl {
    display: flex;
    align-items: center;
    gap: .4rem;
}
.bpm-ctl label {
    font-size: .58rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .08em;
}
.bpm-input {
    width: 54px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: .8rem;
    padding: 3px 6px;
    border-radius: 4px;
    text-align: center;
}
.bpm-input:focus { outline: none; border-color: var(--accent); }

.cycle-info {
    font-size: .55rem;
    color: var(--text-dim);
    margin-left: auto;
    text-align: right;
    line-height: 1.5;
}

/* ── Gallery ── */
.gallery {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.2rem;
}
.gal-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: .85rem;
    flex-wrap: wrap;
    gap: .4rem;
}
.gal-title {
    font-size: .68rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--text-dim);
}
.gal-stats {
    font-size: .6rem;
    color: var(--text-dim);
}
.gal-stats b { color: var(--text); font-weight: 600; }

.gal-groups { display: flex; flex-direction: column; gap: .7rem; }
.gal-group {
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
}
.grp-hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .55rem .7rem;
    background: var(--bg);
    cursor: pointer;
    transition: background .12s;
    user-select: none;
}
.grp-hdr:hover { background: var(--bg-hover); }
.grp-title { font-size: .62rem; color: var(--text); letter-spacing: .04em; }
.grp-meta {
    display: flex;
    align-items: center;
    gap: .6rem;
}
.grp-cnt {
    font-size: .55rem;
    color: var(--text-dim);
    background: var(--bg-panel);
    padding: 2px 8px;
    border-radius: 9px;
}
.grp-arrow {
    font-size: .55rem;
    color: var(--text-dim);
    transition: transform .2s;
}
.grp-hdr.open .grp-arrow { transform: rotate(90deg); }

.grp-body {
    display: none;
    padding: .7rem;
    flex-wrap: wrap;
    gap: 5px;
    max-height: 320px;
    overflow-y: auto;
}
.grp-body.open { display: flex; }

.gal-item {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    transition: all .12s;
}
.gal-item:hover { border-color: var(--text-dim); transform: translateY(-1px); }
.gal-item.sel { border-color: var(--hit); box-shadow: 0 0 8px var(--hit-dim); }
.gal-dot {
    width: 9px; height: 9px;
    min-width: 9px;
    border-radius: 2px;
}
.gal-dot.gh { background: var(--hit); }
.gal-dot.gr { background: var(--rest); border: 1px solid var(--border); }
.gal-cnt {
    font-size: .48rem;
    color: var(--text-dim);
    margin-left: 3px;
    white-space: nowrap;
}

.gal-overflow {
    font-size: .58rem;
    color: var(--text-dim);
    padding: .5rem;
    text-align: center;
    cursor: pointer;
}
.gal-overflow:hover { color: var(--text); }

/* ── Responsive ── */
@media (max-width: 780px) {
    .sequencers { grid-template-columns: 1fr; }
    .container { padding: .9rem; }
    .viz-top { flex-direction: column; }
    .step-btn { width: 34px; height: 34px; }
    .step-btn .led { width: 10px; height: 10px; }
}

::-webkit-scrollbar { height: 5px; width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); border-radius: 3px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.6; } }
.playing-indicator { animation: pulse .5s ease-in-out infinite; }
</style>
</head>
<body>

<div class="header">
    <h1>Moog <span class="ca">Laby</span><span class="cb">rinth</span> Polyrhythm Explorer</h1>
    <div class="sub">Visualize every polyrhythm from two parallel step sequencers</div>
</div>

<div class="container">
    <div class="sequencers">
        <div class="seq-panel spa" id="panelA"></div>
        <div class="seq-panel spb" id="panelB"></div>
    </div>
    <div class="viz" id="vizPanel"></div>
    <div class="gallery" id="galPanel"></div>
</div>

<script>
// ─── State ───
const S = {
    a: { len: 5, steps: [1,0,1,0,1,0,0,0] },
    b: { len: 3, steps: [1,0,0,0,0,0,0,0] },
    playing: false,
    playhead: -1,
    bpm: 200,
    galData: null,
    galExpanded: {},
    galShowAll: {},
    selectedGalKey: null,
};

// ─── Utilities ───
function gcd(a, b) { while (b) { [a, b] = [b, a % b]; } return a; }
function lcmOf(a, b) { return (a / gcd(a, b)) * b; }

function divisors(n) {
    const d = [];
    for (let i = 1; i * i <= n; i++) {
        if (n % i === 0) { d.push(i); if (i !== n / i) d.push(n / i); }
    }
    return d.sort((a, b) => a - b);
}

// ─── Pattern Computation ───
function computePattern() {
    const la = S.a.len, lb = S.b.len;
    const cycle = lcmOf(la, lb);
    const combined = new Uint8Array(cycle);  // 0=none,1=A,2=B,3=both
    const binary = new Uint8Array(cycle);    // 0=rest,1=hit
    for (let i = 0; i < cycle; i++) {
        const a = S.a.steps[i % la] ? 1 : 0;
        const b = S.b.steps[i % lb] ? 2 : 0;
        combined[i] = a | b;
        binary[i] = (a | b) ? 1 : 0;
    }
    const minP = findMinPeriod(binary);
    const detailMinP = findMinPeriod(combined);
    return { combined, binary, minP, detailMinP, cycle, la, lb };
}

function findMinPeriod(pat) {
    const n = pat.length;
    if (n === 0) return 1;
    const divs = divisors(n);
    for (const k of divs) {
        let ok = true;
        for (let i = k; i < n; i++) {
            if (pat[i] !== pat[i % k]) { ok = false; break; }
        }
        if (ok) return k;
    }
    return n;
}

// ─── Gallery Computation ───
function computeGallery() {
    const la = S.a.len, lb = S.b.len;
    const cycle = lcmOf(la, lb);
    const total = (1 << la) * (1 << lb);
    const map = new Map();

    for (let ma = 0; ma < (1 << la); ma++) {
        for (let mb = 0; mb < (1 << lb); mb++) {
            // Build binary pattern
            const pat = new Uint8Array(cycle);
            for (let i = 0; i < cycle; i++) {
                const a = (ma >> (i % la)) & 1;
                const b = (mb >> (i % lb)) & 1;
                pat[i] = (a | b) ? 1 : 0;
            }
            const minP = findMinPeriod(pat);
            // Build key from min pattern
            let key = '';
            for (let i = 0; i < minP; i++) key += pat[i];

            if (!map.has(key)) {
                const p = new Uint8Array(minP);
                for (let i = 0; i < minP; i++) p[i] = pat[i];
                map.set(key, { pattern: p, len: minP, count: 1,
                    hits: p.reduce((s, v) => s + v, 0), eMa: ma, eMb: mb, key });
            } else {
                map.get(key).count++;
            }
        }
    }

    const items = Array.from(map.values());
    items.sort((a, b) => a.len - b.len || a.hits - b.hits || a.key.localeCompare(b.key));
    const groups = new Map();
    for (const it of items) {
        if (!groups.has(it.len)) groups.set(it.len, []);
        groups.get(it.len).push(it);
    }
    S.galData = { total, unique: items.length, groups };
    S.galExpanded = {};
    S.galShowAll = {};
    S.selectedGalKey = null;
}

// ─── Render: Sequencer Panels ───
function renderSeqPanel(which) {
    const seq = S[which];
    const isA = which === 'a';
    const el = document.getElementById(isA ? 'panelA' : 'panelB');
    const label = isA ? 'Sequencer A' : 'Sequencer B';

    let h = `<div class="seq-title"><span class="seq-dot"></span>${label}</div>`;
    h += `<div class="len-row"><label>Length</label><div class="len-btns">`;
    for (let i = 1; i <= 8; i++) {
        h += `<button class="len-btn${seq.len === i ? ' active' : ''}" data-seq="${which}" data-len="${i}">${i}</button>`;
    }
    h += `</div></div>`;

    h += `<div class="steps-row" style="margin-top:18px;">`;
    for (let i = 0; i < seq.len; i++) {
        h += `<div class="step-btn${seq.steps[i] ? ' on' : ''}" data-seq="${which}" data-step="${i}">
            <span class="snum">${i + 1}</span><span class="led"></span></div>`;
    }
    h += `</div>`;

    h += `<div class="quick-row">`;
    h += `<button class="qbtn" data-seq="${which}" data-act="all">All On</button>`;
    h += `<button class="qbtn" data-seq="${which}" data-act="none">All Off</button>`;
    h += `<button class="qbtn" data-seq="${which}" data-act="inv">Invert</button>`;
    h += `<button class="qbtn" data-seq="${which}" data-act="rand">Random</button>`;
    h += `<button class="qbtn" data-seq="${which}" data-act="rotl">↻ Rot</button>`;
    h += `</div>`;

    el.innerHTML = h;
}

// ─── Render: Visualization ───
function renderViz() {
    const { combined, binary, minP, detailMinP, cycle, la, lb } = computePattern();
    const el = document.getElementById('vizPanel');

    let h = `<div class="viz-top">
        <div class="viz-title">Combined Polyrhythm</div>
        <div class="viz-stats">
            <div><div class="stat-label">Full cycle</div><div class="stat-val">${cycle} steps</div></div>
            <div><div class="stat-label">Min repeat</div><div class="stat-val gold">${minP} step${minP !== 1 ? 's' : ''}</div></div>
            <div><div class="stat-label">LCM(${la},${lb})</div><div class="stat-val">${cycle}</div></div>
        </div>
    </div>`;

    h += `<div class="legend">
        <span><i class="ld la"></i> Seq A only</span>
        <span><i class="ld lb"></i> Seq B only</span>
        <span><i class="ld lboth"></i> Both</span>
        <span><i class="ld lrest"></i> Rest</span>
    </div>`;

    h += `<div class="timeline" id="timeline">`;

    // Step numbers
    h += `<div class="tl-row"><div class="tl-label ln">#</div><div class="tl-cells">`;
    for (let i = 0; i < cycle; i++) {
        h += `<div class="tl-num${(i > 0 && i % minP === 0) ? ' bnd' : ''}">${i + 1}</div>`;
    }
    h += `</div></div>`;

    // Seq A row
    h += `<div class="tl-row"><div class="tl-label la">Seq A</div><div class="tl-cells">`;
    for (let i = 0; i < cycle; i++) {
        const on = S.a.steps[i % la];
        h += `<div class="tl-cell${on ? ' on-a' : ''}${(i > 0 && i % minP === 0) ? ' bnd' : ''}"
            data-i="${i}" title="Step ${i + 1}: A[${(i % la) + 1}]=${on ? 'ON' : 'off'}"></div>`;
    }
    h += `</div></div>`;

    // Seq B row
    h += `<div class="tl-row"><div class="tl-label lb">Seq B</div><div class="tl-cells">`;
    for (let i = 0; i < cycle; i++) {
        const on = S.b.steps[i % lb];
        h += `<div class="tl-cell${on ? ' on-b' : ''}${(i > 0 && i % minP === 0) ? ' bnd' : ''}"
            data-i="${i}" title="Step ${i + 1}: B[${(i % lb) + 1}]=${on ? 'ON' : 'off'}"></div>`;
    }
    h += `</div></div>`;

    // Combined row
    h += `<div class="tl-row"><div class="tl-label lc">Result</div><div class="tl-cells" id="tlCombined">`;
    for (let i = 0; i < cycle; i++) {
        const v = combined[i];
        const cls = v === 3 ? 'on-ab' : v === 1 ? 'on-a' : v === 2 ? 'on-b' : '';
        const src = v === 3 ? 'A+B' : v === 1 ? 'A' : v === 2 ? 'B' : '—';
        h += `<div class="tl-cell ${cls}${(i > 0 && i % minP === 0) ? ' bnd' : ''}"
            data-i="${i}" title="Step ${i + 1}: ${src}"></div>`;
    }
    h += `</div></div>`;

    // Repeat bracket markers
    const nRepeats = cycle / minP;
    if (nRepeats > 1) {
        h += `<div class="tl-row"><div class="tl-label ln"></div><div class="tl-cells">`;
        const colors = ['var(--hit)', 'var(--accent)'];
        for (let r = 0; r < nRepeats; r++) {
            const color = colors[r % 2];
            for (let i = 0; i < minP; i++) {
                const first = r * minP + i;
                h += `<div style="width:18px;min-width:18px;height:3px;border-radius:1px;background:${color};opacity:.5;margin-right:2px;${(first > 0 && first % minP === 0) ? 'margin-left:4px;' : ''}"></div>`;
            }
        }
        h += `</div></div>`;
    }

    h += `</div>`; // end timeline

    // Min pattern
    h += `<div class="minpat">`;
    h += `<div class="minpat-title">Minimum Repeating Pattern · ${minP} step${minP !== 1 ? 's' : ''}</div>`;
    h += `<div class="minpat-cells">`;
    for (let i = 0; i < minP; i++) {
        const hit = binary[i];
        h += `<div class="mc ${hit ? 'mhit' : 'mrest'}">${hit ? '●' : '·'}</div>`;
    }
    h += `</div>`;
    const patStr = Array.from(binary.subarray(0, minP)).map(b => b ? '●' : '·').join(' ');
    h += `<div class="pat-text">${patStr}</div>`;

    // Show detail pattern if 4-state min period differs
    if (detailMinP > minP) {
        const detailStr = Array.from(combined.subarray(0, detailMinP)).map(v =>
            v === 3 ? 'AB' : v === 1 ? 'A' : v === 2 ? 'B' : '··'
        ).join(' ');
        h += `<div class="pat-detail-text">Source detail (${detailMinP}-step cycle): ${detailStr}</div>`;
    } else if (minP > 0) {
        const detailStr = Array.from(combined.subarray(0, minP)).map(v =>
            v === 3 ? 'AB' : v === 1 ? 'A' : v === 2 ? 'B' : '··'
        ).join(' ');
        h += `<div class="pat-detail-text">Sources: ${detailStr}</div>`;
    }
    h += `</div>`;

    // Playback
    h += `<div class="playback">
        <button class="play-btn${S.playing ? ' on' : ''}" id="playBtn">${S.playing ? '■' : '▶'}</button>
        <div class="bpm-ctl">
            <label>BPM</label>
            <input class="bpm-input" id="bpmInput" type="number" min="40" max="600" value="${S.bpm}">
        </div>
        <div class="cycle-info">
            ${la} against ${lb} · repeats ${nRepeats > 1 ? nRepeats + '× per cycle' : 'once per cycle'}<br>
            Density: ${Math.round(Array.from(binary.subarray(0, minP)).reduce((s, v) => s + v, 0) / minP * 100)}%
        </div>
    </div>`;

    el.innerHTML = h;
}

// ─── Render: Gallery ───
function renderGallery() {
    if (!S.galData) computeGallery();
    const { total, unique, groups } = S.galData;
    const el = document.getElementById('galPanel');
    const INITIAL_SHOW = 80;

    let h = `<div class="gal-top">
        <div class="gal-title">All Unique Rhythm Patterns</div>
        <div class="gal-stats"><b>${unique.toLocaleString()}</b> unique patterns from <b>${total.toLocaleString()}</b> combinations</div>
    </div>`;

    h += `<div class="gal-groups">`;
    for (const [len, items] of groups) {
        const isOpen = S.galExpanded[len] || false;
        const showAll = S.galShowAll[len] || false;
        const showing = showAll ? items.length : Math.min(items.length, INITIAL_SHOW);
        const density = items.length > 0 ? Math.round(items[0].hits / items[0].len * 100) : 0;

        h += `<div class="gal-group">`;
        h += `<div class="grp-hdr${isOpen ? ' open' : ''}" data-grp="${len}">
            <div class="grp-title">${len} step${len !== 1 ? 's' : ''}</div>
            <div class="grp-meta">
                <span class="grp-cnt">${items.length} pattern${items.length !== 1 ? 's' : ''}</span>
                <span class="grp-arrow">▶</span>
            </div>
        </div>`;

        h += `<div class="grp-body${isOpen ? ' open' : ''}" id="grp-${len}">`;
        for (let j = 0; j < showing; j++) {
            const it = items[j];
            const isSel = S.selectedGalKey === it.key;
            h += `<div class="gal-item${isSel ? ' sel' : ''}" data-gkey="${it.key}" data-ma="${it.eMa}" data-mb="${it.eMb}"
                title="${Array.from(it.pattern).map(b => b ? '●' : '·').join('')} — ${it.count} combo${it.count > 1 ? 's' : ''}">`;
            for (let k = 0; k < it.len; k++) {
                h += `<div class="gal-dot ${it.pattern[k] ? 'gh' : 'gr'}"></div>`;
            }
            h += `<span class="gal-cnt">×${it.count}</span></div>`;
        }
        if (!showAll && items.length > INITIAL_SHOW) {
            h += `<div class="gal-overflow" data-grpshow="${len}">Show all ${items.length} patterns…</div>`;
        }
        h += `</div></div>`;
    }
    h += `</div>`;

    el.innerHTML = h;
}

// ─── Audio ───
let audioCtx = null;

function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, time, dur, gain) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(gain, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(time);
    o.stop(time + dur + 0.01);
}

function playNoise(time, dur, gain, hipass) {
    const bufSize = audioCtx.sampleRate * dur;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = 'highpass';
    flt.frequency.value = hipass;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(gain, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur);
    src.connect(flt);
    flt.connect(g);
    g.connect(audioCtx.destination);
    src.start(time);
    src.stop(time + dur + 0.01);
}

let playTimer = null;

function startPlay() {
    ensureAudio();
    S.playing = true;
    S.playhead = 0;
    const { combined, cycle } = computePattern();
    const secPerStep = 60 / S.bpm;

    let nextTime = audioCtx.currentTime + 0.05;
    let step = 0;

    function schedule() {
        if (!S.playing) return;
        while (nextTime < audioCtx.currentTime + 0.15) {
            const v = combined[step % cycle];
            if (v & 1) { playTone(880, nextTime, 0.06, 0.18); playNoise(nextTime, 0.03, 0.08, 6000); }
            if (v & 2) { playTone(330, nextTime, 0.08, 0.22); playNoise(nextTime, 0.04, 0.06, 2000); }

            const showStep = step % cycle;
            const delay = Math.max(0, (nextTime - audioCtx.currentTime) * 1000);
            setTimeout(() => {
                if (!S.playing) return;
                S.playhead = showStep;
                updatePlayhead();
            }, delay);

            step++;
            nextTime += secPerStep;
        }
    }
    schedule();
    playTimer = setInterval(schedule, 30);
    renderViz();
}

function stopPlay() {
    S.playing = false;
    S.playhead = -1;
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
    renderViz();
}

function updatePlayhead() {
    const cells = document.querySelectorAll('#tlCombined .tl-cell');
    cells.forEach((c, i) => {
        c.classList.toggle('playhead', i === S.playhead);
    });
}

// ─── Event Delegation ───
document.addEventListener('click', e => {
    const t = e.target;

    // Length button
    const lenBtn = t.closest('.len-btn');
    if (lenBtn) {
        const seq = lenBtn.dataset.seq;
        const len = parseInt(lenBtn.dataset.len);
        S[seq].len = len;
        const wasPlaying = S.playing;
        if (wasPlaying) stopPlay();
        computeGallery();
        renderAll();
        if (wasPlaying) startPlay();
        return;
    }

    // Step button
    const stepBtn = t.closest('.step-btn');
    if (stepBtn) {
        const seq = stepBtn.dataset.seq;
        const step = parseInt(stepBtn.dataset.step);
        S[seq].steps[step] = S[seq].steps[step] ? 0 : 1;
        const wasPlaying = S.playing;
        if (wasPlaying) stopPlay();
        renderAll();
        if (wasPlaying) startPlay();
        return;
    }

    // Quick actions
    const qbtn = t.closest('.qbtn');
    if (qbtn) {
        const seq = qbtn.dataset.seq;
        const act = qbtn.dataset.act;
        const s = S[seq];
        const wasPlaying = S.playing;
        if (wasPlaying) stopPlay();
        if (act === 'all') { for (let i = 0; i < 8; i++) s.steps[i] = i < s.len ? 1 : 0; }
        else if (act === 'none') { for (let i = 0; i < 8; i++) s.steps[i] = 0; }
        else if (act === 'inv') { for (let i = 0; i < s.len; i++) s.steps[i] = s.steps[i] ? 0 : 1; }
        else if (act === 'rand') { for (let i = 0; i < s.len; i++) s.steps[i] = Math.random() > 0.5 ? 1 : 0; }
        else if (act === 'rotl') {
            const first = s.steps[0];
            for (let i = 0; i < s.len - 1; i++) s.steps[i] = s.steps[i + 1];
            s.steps[s.len - 1] = first;
        }
        renderAll();
        if (wasPlaying) startPlay();
        return;
    }

    // Play button
    if (t.closest('#playBtn')) {
        if (S.playing) stopPlay(); else startPlay();
        return;
    }

    // Gallery group toggle
    const grpHdr = t.closest('.grp-hdr');
    if (grpHdr) {
        const g = parseInt(grpHdr.dataset.grp);
        S.galExpanded[g] = !S.galExpanded[g];
        grpHdr.classList.toggle('open');
        const body = document.getElementById('grp-' + g);
        if (body) body.classList.toggle('open');
        const arrow = grpHdr.querySelector('.grp-arrow');
        return;
    }

    // Gallery show all
    const showAll = t.closest('.gal-overflow');
    if (showAll) {
        const g = parseInt(showAll.dataset.grpshow);
        S.galShowAll[g] = true;
        renderGallery();
        S.galExpanded[g] = true;
        const body = document.getElementById('grp-' + g);
        if (body) body.classList.add('open');
        const hdr = body?.previousElementSibling;
        if (hdr) hdr.classList.add('open');
        return;
    }

    // Gallery item click
    const galItem = t.closest('.gal-item');
    if (galItem) {
        const ma = parseInt(galItem.dataset.ma);
        const mb = parseInt(galItem.dataset.mb);
        const key = galItem.dataset.gkey;
        const wasPlaying = S.playing;
        if (wasPlaying) stopPlay();

        // Set steps from masks
        for (let i = 0; i < 8; i++) {
            S.a.steps[i] = i < S.a.len ? ((ma >> i) & 1) : 0;
            S.b.steps[i] = i < S.b.len ? ((mb >> i) & 1) : 0;
        }
        S.selectedGalKey = key;
        renderSeqPanel('a');
        renderSeqPanel('b');
        renderViz();
        // Update gallery selection visuals
        document.querySelectorAll('.gal-item').forEach(gi => gi.classList.toggle('sel', gi.dataset.gkey === key));
        if (wasPlaying) startPlay();

        // Scroll viz into view
        document.getElementById('vizPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        return;
    }
});

// BPM input
document.addEventListener('input', e => {
    if (e.target.id === 'bpmInput') {
        const v = parseInt(e.target.value);
        if (v >= 40 && v <= 600) {
            S.bpm = v;
            if (S.playing) { stopPlay(); startPlay(); }
        }
    }
});

// ─── Render All ───
function renderAll() {
    renderSeqPanel('a');
    renderSeqPanel('b');
    renderViz();
    renderGallery();
}

// ─── Init ───
computeGallery();
renderAll();
// Auto-expand first group
const firstGroupLen = S.galData ? Array.from(S.galData.groups.keys())[0] : null;
if (firstGroupLen != null) {
    S.galExpanded[firstGroupLen] = true;
    const body = document.getElementById('grp-' + firstGroupLen);
    if (body) body.classList.add('open');
    const hdr = body?.previousElementSibling;
    if (hdr) hdr.classList.add('open');
}
</script>
